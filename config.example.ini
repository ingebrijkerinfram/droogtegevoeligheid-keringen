; Persoonlijke padinstellingen voor het droogtegevoeligheidsmodel.
;
; Meestal hoef je NIETS in te stellen: het script zoekt zelf de gesynchroniseerde
; SharePoint-map van project 000687 onder je gebruikersmap en gebruikt daarin:
;   klimaatdata = <projectmap>\Uitvoering\Methode\Input\KNMI Data Klimaatscenarios
;   locaties    = <projectmap>\Uitvoering\Methode\Input\Gridkaart Nederland\LatLong_grids.xlsx
;   output      = <projectmap>\Uitvoering\Methode\Output
;
; Wil je iets anders (bijv. de KNMI-data van een snelle lokale schijf lezen)?
; Kopieer dit bestand naar config.ini (zelfde map), haal de ';' weg voor de regel
; die je wilt aanpassen en vul het pad in. Gewoon plakken uit de Verkenner mag,
; zonder aanhalingstekens. config.ini staat in .gitignore en is alleen van jou.

[paden]
; projectmap  = C:\Users\<naam>\Infram BV\Infram Projecten - 000687 Vervolg stresstest droogte
; klimaatdata = D:\KNMI23
; locaties    = C:\Users\<naam>\Documenten\LatLong_grids.xlsx
; output      = C:\Users\<naam>\Documenten\Droogtemodel\Output
